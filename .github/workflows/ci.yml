name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  session-lab:
    name: Session labs (Hardhat)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: session/hardhat-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: session/hardhat-lab/package-lock.json
      - run: npm ci
      - run: npx hardhat test
      - run: npx tsc --noEmit

  dapp:
    name: Full-stack DApp (Hardhat + Express + React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dapp
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voting
          POSTGRES_PASSWORD: voting
          POSTGRES_DB: voting
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voting" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://voting:voting@localhost:5432/voting_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dapp/package-lock.json
      - run: npm ci
      - name: Contracts - compile & test
        run: npm run test -w contracts
      - name: Backend - test against PostgreSQL
        run: npm run test -w backend
      - name: Frontend - test
        run: npm run test -w frontend
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Frontend - production build
        run: npm run build -w frontend
