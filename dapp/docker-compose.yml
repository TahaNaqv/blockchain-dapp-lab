# Local infrastructure. `npm run db:up` starts PostgreSQL only; `docker compose up --build` also runs the backend.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: voting
      POSTGRES_PASSWORD: voting
      POSTGRES_DB: voting
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voting -d voting"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["full"]
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql://voting:voting@db:5432/voting
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
